<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<title id="title">ANFIS-inspired model architecture</title><desc id="desc">Input features feed two parallel paths: eight Gaussian rule scores normalized with softmax, and eight affine rule outputs. The weighted sum becomes a logit and passes through sigmoid.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7ca99c"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#fbfdf9"/><g font-family="Arial, sans-serif"><text x="360" y="32" text-anchor="middle" font-size="16" fill="#244b48" font-weight="600">8-input ANFIS-inspired classifier</text><rect x="24" y="145" width="110" height="68" rx="12" fill="#edf5ef" stroke="#b5d1c2"/><text x="79.0" y="176.0" text-anchor="middle" font-size="15" fill="#244b48" font-weight="600">8 inputs</text><text x="79.0" y="198.0" text-anchor="middle" font-size="12" fill="#5c7770" font-weight="400">standardized</text><path d="M134 164 L170 99" fill="none" stroke="#7ca99c" stroke-width="1.6" opacity="1" marker-end="url(#arrow)"/><path d="M134 184 L170 249" fill="none" stroke="#7ca99c" stroke-width="1.6" opacity="1" marker-end="url(#arrow)"/><rect x="178" y="62" width="196" height="74" rx="12" fill="#edf5ef" stroke="#b5d1c2"/><text x="276.0" y="96.0" text-anchor="middle" font-size="15" fill="#244b48" font-weight="600">Gaussian rule scores</text><text x="276.0" y="118.0" text-anchor="middle" font-size="12" fill="#5c7770" font-weight="400">8 learned rules</text><rect x="178" y="212" width="196" height="74" rx="12" fill="#edf5ef" stroke="#b5d1c2"/><text x="276.0" y="246.0" text-anchor="middle" font-size="15" fill="#244b48" font-weight="600">Affine rule outputs</text><text x="276.0" y="268.0" text-anchor="middle" font-size="12" fill="#5c7770" font-weight="400">8 learned consequents</text><path d="M374 99 L408 99" fill="none" stroke="#7ca99c" stroke-width="1.6" opacity="1" marker-end="url(#arrow)"/><rect x="416" y="62" width="133" height="74" rx="12" fill="#edf5ef" stroke="#b5d1c2"/><text x="482.5" y="96.0" text-anchor="middle" font-size="15" fill="#244b48" font-weight="600">Softmax</text><text x="482.5" y="118.0" text-anchor="middle" font-size="12" fill="#5c7770" font-weight="400">rule weights</text><path d="M549 99 L581 159" fill="none" stroke="#7ca99c" stroke-width="1.6" opacity="1" marker-end="url(#arrow)"/><path d="M374 249 L581 194" fill="none" stroke="#7ca99c" stroke-width="1.6" opacity="1" marker-end="url(#arrow)"/><rect x="589" y="145" width="106" height="70" rx="12" fill="#edf5ef" stroke="#b5d1c2"/><text x="642.0" y="177.0" text-anchor="middle" font-size="15" fill="#244b48" font-weight="600">Weighted sum</text><text x="642.0" y="199.0" text-anchor="middle" font-size="12" fill="#5c7770" font-weight="400">logit</text><text x="520" y="255" text-anchor="middle" font-size="14" fill="#244b48" font-weight="600">logit → sigmoid → 0–1 score</text><text x="360" y="325" text-anchor="middle" font-size="15" fill="#244b48" font-weight="600">Normalize rule strengths, then combine their learned outputs.</text></g></svg>