<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<title id="title">Always non-bankrupt baseline</title><desc id="desc">Every company receives class zero regardless of its inputs. This untrained baseline detects none of the bankrupt records.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7ca99c"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#fbfdf9"/><g font-family="Arial, sans-serif"><text x="360" y="44" text-anchor="middle" font-size="16" fill="#244b48" font-weight="600">Always predict non-bankrupt · reference baseline</text><rect x="46" y="141" width="170" height="78" rx="12" fill="#edf5ef" stroke="#b5d1c2"/><text x="131.0" y="185.0" text-anchor="middle" font-size="15" fill="#244b48" font-weight="600">Any company record</text><path d="M216 180 L296 180" fill="none" stroke="#7ca99c" stroke-width="1.6" opacity="1" marker-end="url(#arrow)"/><rect x="304" y="141" width="170" height="78" rx="12" fill="#edf5ef" stroke="#b5d1c2"/><text x="389.0" y="177.0" text-anchor="middle" font-size="15" fill="#244b48" font-weight="600">Fixed prediction</text><text x="389.0" y="199.0" text-anchor="middle" font-size="12" fill="#5c7770" font-weight="400">class 0</text><path d="M474 180 L537 180" fill="none" stroke="#7ca99c" stroke-width="1.6" opacity="1" marker-end="url(#arrow)"/><rect x="545" y="141" width="135" height="78" rx="12" fill="#e6f1ce" stroke="#b5d1c2"/><text x="612.5" y="185.0" text-anchor="middle" font-size="15" fill="#244b48" font-weight="600">Non-bankrupt</text><text x="360" y="312" text-anchor="middle" font-size="15" fill="#244b48" font-weight="600">No learned parameters. This baseline finds zero bankrupt records.</text></g></svg>