<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<title id="title">Decision tree branching schematic</title><desc id="desc">A schematic shows indicator tests branching to leaves. It does not display learned feature names or thresholds. The experiment limits depth to four and uses at least twenty records per leaf.</desc>
